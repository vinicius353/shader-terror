name: Compilar shader de terror

on:
  workflow_dispatch:
  push:
    paths:
      - "projeto.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pillow
        run: pip install pillow

      - name: Baixar o compilador shaderc (bgfx-mcbe)
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          set -x
          mkdir -p dl
          pick() {
            # $1 = repo, $2 = tag
            gh release view "$2" -R "$1" --json assets -q '.assets[].name' > dl/assets.txt || return 1
            cat dl/assets.txt
            NAME=$(grep -i shaderc dl/assets.txt | grep -i linux | grep -iv -e arm -e aarch | head -n1 || true)
            [ -z "$NAME" ] && NAME=$(grep -i shaderc dl/assets.txt | grep -i linux | head -n1 || true)
            [ -z "$NAME" ] && return 1
            gh release download "$2" -R "$1" -p "$NAME" -D dl --clobber
            echo "$NAME" > dl/name.txt
          }
          pick devendrn/newb-shader dev || pick devendrn/RenderDragonSourceCodeInv v1
          NAME=$(cat dl/name.txt)
          cd dl
          case "$NAME" in
            *.zip) unzip -oq "$NAME" -d ex ;;
            *.tar.gz|*.tgz) mkdir ex && tar xf "$NAME" -C ex ;;
            *) mkdir ex && cp "$NAME" ex/ ;;
          esac
          BIN=$(find ex -type f -iname 'shaderc*' ! -iname '*.zip' ! -iname '*.tar*' | head -n1)
          echo "shaderc encontrado: $BIN"
          sudo cp "$BIN" /usr/local/bin/shaderc
          sudo chmod +x /usr/local/bin/shaderc
          shaderc -v || true

      - name: Descompactar o projeto
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          mkdir -p work
          unzip -oq projeto.zip -d work
          ls -R work | head -50

      - name: Preparar os shaders (bgfx_shader.sh e horror.sh)
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          URL="https://raw.githubusercontent.com/SurvivalApparatusCommunication/RenderDragonSourceCodeInv/1.20.60/include/bgfx_shader.sh"
          mkdir -p work/_common
          mv work/projeto/_common/horror.sh work/_common/horror.sh
          rmdir work/projeto/_common
          for d in work/projeto/*/shaders; do
            curl -fsSL "$URL" -o "$d/bgfx_shader.sh"
            cp work/_common/horror.sh "$d/horror.sh"
          done
          ls work/projeto

      - name: Compilar com o lazurite (testa varias versoes)
        run: |
          set +e
          for SPEC in "lazurite==0.10.0" "lazurite" "git+https://github.com/veka0/lazurite.git"; do
            echo "=================== Tentando: $SPEC" | tee -a build.log
            pip install --quiet --upgrade --force-reinstall "$SPEC" 2>&1 | tail -3 | tee -a build.log
            pip show lazurite | grep -i '^version' | tee -a build.log
            lazurite build work/projeto 2>&1 | tee -a build.log
            if [ "${PIPESTATUS[0]}" -eq 0 ]; then
              echo "SUCESSO com $SPEC" | tee -a build.log
              exit 0
            fi
          done
          echo "Nenhuma versao do lazurite funcionou" | tee -a build.log
          exit 1

      - name: Montar o pack (.mcpack)
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          mkdir -p pack/renderer/materials
          echo "--- tamanhos (compilado em work/, base em work/projeto/vanilla/):"
          ls -l work/*.material.bin work/projeto/vanilla/*.material.bin
          echo "--- todos os .material.bin do servidor:"
          find . -name '*.material.bin' -not -path './pack/*' | tee todos.txt
          FOUND=$(grep -v 'vanilla' todos.txt || true)
          echo "--- usando:"
          echo "$FOUND"
          [ -n "$FOUND" ] || { echo "Nenhum .material.bin foi gerado"; exit 1; }
          for f in $FOUND; do cp "$f" pack/renderer/materials/; done
          cat > pack/manifest.json <<'JSON'
          {
            "format_version": 2,
            "header": {
              "name": "Terror Lanterna (leve)",
              "description": "Shader leve de terror: escuridao e lanterna",
              "uuid": "dbaa9952-1dd4-48c7-8244-2b66ae1fde49",
              "version": [0, 2, 0],
              "min_engine_version": [1, 21, 0]
            },
            "modules": [
              {
                "type": "resources",
                "uuid": "6e425064-cc52-4077-9056-4c2bd57d3e9c",
                "version": [0, 2, 0]
              }
            ]
          }
          JSON
          python - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new("RGB", (256, 256), (6, 8, 12))
          d = ImageDraw.Draw(im)
          d.polygon([(128, 20), (40, 236), (216, 236)], fill=(70, 62, 40))
          d.ellipse([108, 10, 148, 50], fill=(255, 240, 190))
          im.save("pack/pack_icon.png")
          PY
          cd pack && zip -qr ../terror-lanterna.mcpack . && cd ..
          ls -l terror-lanterna.mcpack

      - name: Salvar o log no repositorio
        if: always()
        run: |
          mkdir -p logs
          cp build.log logs/build.log || echo "sem log" > logs/build.log
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logs/build.log
          git commit -m "log do build ${{ github.run_number }}" || true
          git push || true

      - name: Guardar arquivos do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-build
          path: |
            terror-lanterna.mcpack
            build.log
          if-no-files-found: ignore

      - name: Publicar na aba Releases (download direto no celular)
        run: |
          gh release create "build-${{ github.run_number }}" terror-lanterna.mcpack build.log \
            --title "Build ${{ github.run_number }}" \
            --notes "Shader de terror compilado automaticamente."
